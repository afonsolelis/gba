# gba-api no Coolify (projeto gba, serviço hyrtindyx5cfhhioy7heu7pc).
# Fonte da verdade do compose da VPS. Quem aplica é o CI (.github/workflows/ci.yml):
# troca __VERSAO__ pelo commit, manda o compose para o Coolify pela API e reinicia o serviço.
# Imagens no GHCR; a VPS tem `docker login ghcr.io` com um token só de leitura.
# `site` serve o docs/ em https://gba.afonsolelis.tech (imagem nginx com o site dentro).
# Segredos são variáveis do serviço no Coolify (cópia em ~/repos/hostinger/.env, GBA_*).
services:
  api:
    image: 'ghcr.io/afonsolelis/gba-api:__VERSAO__'
    environment:
      SERVICE_FQDN_API_8080: ''
      PORT: '8080'
      S3_ENDPOINT: 'https://s3.afonsolelis.tech'
      S3_BUCKET: gba
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PIN_SCRYPT: ${PIN_SCRYPT}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_ORIGINS: 'https://afonsolelis.github.io,https://gba.afonsolelis.tech'
      TZ: America/Sao_Paulo
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  site:
    image: 'ghcr.io/afonsolelis/gba-site:__VERSAO__'
    environment:
      SERVICE_FQDN_SITE_80: ''
    mem_limit: 32m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
