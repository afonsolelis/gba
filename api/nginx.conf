# Site estático do gba. HTML e manifest sempre revalidados (versão nova aparece
# na hora); css/js/ícones mudam de nome via ?v=, então podem ficar em cache.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }

    location ~* \.(html|webmanifest)$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; }
    location = / { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; try_files /index.html =404; }
    location ~* \.(js|css|png|svg)$ { add_header Cache-Control "public, max-age=86400" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; }
}
